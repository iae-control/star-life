function spr(name, frame, x, y, scale, alpha){
  const m = MAP[name];
  const idx = m.i + (frame % m.n);
  const sx = (idx % ACOLS) * CW, sy = ((idx / ACOLS) | 0) * CH;
  const w = CW * scale, h = CH * scale;
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(atlas, sx, sy, CW, CH, Math.round(x - w/2), Math.round(y - h/2), w, h);
  if (alpha !== undefined) ctx.globalAlpha = 1;
}

/* ---------- audio ---------- */
let actx = null, muted = false;
function audioInit(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function env(g, t0, a, d, peak){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
}
function tone(type, f0, f1, dur, peak, delay){
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  env(g, t0, 0.005, dur, peak);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBurst(dur, peak, fc0, fc1, delay){
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const n = actx.sampleRate * dur, buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(fc0, t0);
  f.frequency.exponentialRampToValueAtTime(fc1, t0 + dur);
  const g = actx.createGain(); env(g, t0, 0.005, dur, peak);
  src.connect(f).connect(g).connect(actx.destination);
  src.start(t0);
}
const SFX = {
  eshoot(){ tone("square", 300, 180, 0.09, 0.04); },
  boom(){ noiseBurst(0.30, 0.20, 1800, 120); tone("sine", 120, 38, 0.30, 0.18); },
  bigboom(){ noiseBurst(0.6, 0.28, 2200, 80); tone("sine", 90, 30, 0.6, 0.22); },
  hit(){ tone("square", 190, 90, 0.08, 0.12); noiseBurst(0.08, 0.08, 900, 300); },
  deny(){ tone("square", 140, 90, 0.12, 0.08); },
  pow(){ tone("sine", 520, 1040, 0.10, 0.10);
         tone("sine", 660, 1320, 0.10, 0.10, 0.07);
         tone("sine", 780, 1560, 0.14, 0.10, 0.14); },
  buy(){ tone("sine", 700, 1400, 0.08, 0.10); tone("sine", 1050, 2100, 0.10, 0.08, 0.06); },
  warn(){ tone("sawtooth", 160, 620, 0.5, 0.07); },
  superOn(){ tone("sawtooth", 60, 240, 0.8, 0.12); noiseBurst(0.8, 0.10, 400, 3200); },
  spid(){ noiseBurst(0.5, 0.22, 3600, 500); tone("square", 1200, 300, 0.4, 0.08); },
};

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function aabb(ax, ay, aw, ah, bx, by, bw, bh){
  return Math.abs(ax - bx) * 2 < aw + bw && Math.abs(ay - by) * 2 < ah + bh;
}
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- background tilemap ---------- */
const TCOLS = Math.ceil(LW / CW) + 1;
const TROWS = Math.ceil(LH / CH) + 2;
let tmap = [], scrollY = 0, scrollSpd = 34;
function tileRow(){
  const row = [];
  for (let c = 0; c < TCOLS; c++) row.push((Math.random() * 6) | 0);
  return row;
}
function tmapInit(){ tmap = []; for (let r = 0; r < TROWS; r++) tmap.push(tileRow()); scrollY = 0; }
function tmapUpdate(dt){
  scrollY += scrollSpd * dt;
  while (scrollY >= CH){ scrollY -= CH; tmap.pop(); tmap.unshift(tileRow()); }
}
function tmapDraw(){
  ctx.globalAlpha = 0.6;
  for (let r = 0; r < TROWS; r++){
    const y = (r - 1) * CH + scrollY;
    for (let c = 0; c < TCOLS; c++){
      const idx = MAP.tile.i + tmap[r][c];
      const sx = (idx % ACOLS) * CW, sy = ((idx / ACOLS) | 0) * CH;
      ctx.drawImage(atlas, sx, sy, CW, CH, c * CW, Math.round(y), CW, CH);
    }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(2,4,18,0.38)";
  ctx.fillRect(0, 0, LW, LH);
}

/* wave script */
function buildWave(n){
  spawnQ = []; waveT = 0; waveClearT = -1;
  const Q = (t, fn) => spawnQ.push({ t, fn });
  let t = 1.0;
  if (n % 4 === 0){ Q(t + 1.2, () => spawnBoss()); return; }
  const reps = 2 + Math.min(4, (n / 2) | 0);
  for (let r = 0; r < reps; r++){
    const kind = (r + n) % 3;
    if (kind === 0){
      const bx = rnd(50, LW - 50), amp = rnd(30, 60);
      for (let i = 0; i < 5; i++) Q(t + i * 0.28, () => spawnEnemy("e1", bx, { amp }));
      t += 2.6;
    } else if (kind === 1){
      const side = Math.random() < 0.5 ? -1 : 1;
      for (let i = 0; i < 4; i++){
        const yy = 30 + i * 26;
        Q(t + i * 0.22, () => spawnEnemy("e3", side < 0 ? -16 : LW + 16, { vx: -side * rnd(120, 160), y: yy }));
      }
      t += 2.2;
    } else {
      Q(t, () => spawnEnemy("e2", rnd(60, LW - 60), {}));
      if (n > 2) Q(t + 0.5, () => spawnEnemy("e2", rnd(60, LW - 60), {}));
      t += 3.0;
    }
  }
}
function nextWave(){
  G.wave++;
  G.banner = "WAVE " + G.wave; G.bannerT = 1.6;
  scrollSpd = 34 + G.wave * 2;
  buildWave(G.wave);
}

function wpnRowY(i){ return 116 + i * 27; }
function itmRowY(i){ return 272 + i * 27; }
const GOY = 392;
function shopAct(sel){
  if (sel < WKEYS.length){
    const key = WKEYS[sel];
    if (P.weapons[key] === undefined){
      const pr = WPN[key].price;
      if (G.credits < pr){ SFX.deny(); return; }
      G.credits -= pr; P.weapons[key] = 1; P.cur = key; SFX.buy();
    } else if (P.cur !== key){
      P.cur = key; SFX.pow();
    } else SFX.deny();
  } else if (sel < WKEYS.length + ITEMS.length){
    const it = ITEMS[sel - WKEYS.length];
    if (!it.can() || G.credits < it.price()){ SFX.deny(); return; }
    G.credits -= it.price(); it.buy(); SFX.buy();
  } else {
    G.state = "play"; nextWave();
  }
}
function shopKey(key){
  const k = key.toLowerCase();
  if (key === "ArrowUp") shop.sel = (shop.sel + NROWS - 1) % NROWS;
  else if (key === "ArrowDown") shop.sel = (shop.sel + 1) % NROWS;
  else if (key === "Enter" || k === " " || k === "z") shopAct(shop.sel);
}
function shopTap(p){
  for (let i = 0; i < WKEYS.length; i++){
    if (p.x > 14 && p.x < LW - 14 && p.y > wpnRowY(i) - 3 && p.y < wpnRowY(i) + 22){
      shop.sel = i; shopAct(i); return;
    }
  }
  for (let i = 0; i < ITEMS.length; i++){
    if (p.x > 14 && p.x < LW - 14 && p.y > itmRowY(i) - 3 && p.y < itmRowY(i) + 22){
      shop.sel = WKEYS.length + i; shopAct(shop.sel); return;
    }
  }
  if (p.x > 60 && p.x < LW - 60 && p.y > GOY - 6 && p.y < GOY + 28){ shopAct(NROWS - 1); }
}

/* ---------- super weapon: Jungjioo ---------- */
function startSuper(){
  if (G.state !== "play" || !P.alive || SP || P.superN <= 0) return;
  P.superN--;
  SP = { t: 0, holes: [], ph: [], acc: 0, spidSaid: false };
  const n = 3 + (Math.random() < 0.5 ? 1 : 0);
  for (let i = 0; i < n; i++){
    SP.holes.push({ x: 34 + (LW - 68) * ((i + 0.5) / n) + rnd(-16, 16),
                    y: LH - rnd(50, 118), r: rnd(13, 30), seed: rnd(0, 6.283), open: 0 });
  }
  P.inv = 999;
  SFX.superOn();
  G.shake = 5;
}
function updateSuper(dt){
  SP.t += dt;
  for (const h of SP.holes){
    if (SP.t > 0.25) h.open = Math.min(1, h.open + dt * 2.6);
  }
  if (SP.t > 1.0 && !SP.spidSaid){ SP.spidSaid = true; SFX.spid(); }
  if (SP.t > 1.0 && SP.t < 3.0){
    SP.acc += dt * 26;
    while (SP.acc > 1){
      SP.acc -= 1;
      const h = SP.holes[(Math.random() * SP.holes.length) | 0];
      SP.ph.push({ x: h.x + rnd(-h.r, h.r) * 0.7, y: h.y + rnd(-6, 6),
                   vx: rnd(-70, 70), vy: -rnd(470, 680), a: rnd(0.55, 0.95),
                   s: rnd(0.8, 1.25) });
    }
    ebullets.length = 0;
  }
  for (let i = SP.ph.length - 1; i >= 0; i--){
    const q = SP.ph[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    for (const e of enemies){
      if (e.hcd <= 0 && aabb(q.x, q.y, 20, 24, e.x, e.y, e.w, e.h)){
        e.hcd = 0.06; e.hp -= 7;
        if (e.hp <= 0 && !e.dead){ killEnemy(e); }
      }
    }
    if (boss && boss.hcd <= 0 && aabb(q.x, q.y, 20, 24, boss.x, boss.y, boss.w, boss.h)){
      boss.hcd = 0.05; damageBoss(6);
    }
    if (q.y < -40){ SP.ph.splice(i, 1); }
  }
  enemies = enemies.filter(e => !e.dead);
  if (SP.t > 3.4 && SP.ph.length === 0){
    SP = null;
    P.inv = 0.9;
  }
}
function drawHole(h){
  const s = h.open * h.open * (3 - 2 * h.open);
  if (s <= 0.01) return;
  const r = h.r * s;
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(h.x, h.y, r * 0.5, h.x, h.y, r * 1.9);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.55, "rgba(120,80,255,0.30)");
  g.addColorStop(0.8, "rgba(90,180,255,0.18)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(h.x, h.y, r * 1.9, 0, 7); ctx.fill();
  ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++){
    const a0 = G.t * (3 + k) + h.seed + k * 2.1;
    ctx.strokeStyle = "rgba(160,120,255," + (0.5 - k * 0.13) + ")";
    ctx.beginPath(); ctx.arc(h.x, h.y, r * (1.05 + k * 0.22), a0, a0 + 2.2); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}
function drawBubble(msg, bx, by){
  ctx.font = "bold 10px 'Courier New', monospace";
  const w = ctx.measureText(msg).width + 14;
  const x = clamp(bx - w / 2, 4, LW - w - 4), y = by;
  ctx.fillStyle = "#f6f8ff";
  rr(x, y, w, 20, 5); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(clamp(bx, x + 8, x + w - 8) - 4, y + 20);
  ctx.lineTo(clamp(bx, x + 8, x + w - 8) + 4, y + 20);
  ctx.lineTo(clamp(bx, x + 8, x + w - 8), y + 26);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#26305a"; ctx.lineWidth = 1;
  rr(x + 0.5, y + 0.5, w - 1, 19, 5); ctx.stroke();
  ctx.fillStyle = "#101638"; ctx.textAlign = "left";
  ctx.fillText(msg, x + 7, y + 14);
}

/* ---------- game flow ---------- */
function newGame(){
  G.state = "play"; G.t = 0; G.wave = 0; G.score = 0; G.credits = 0; G.shake = 0;
  G.kills = 0; G.orbCount = 0;
  Object.assign(P, { x: LW/2, y: LH - 70, vx: 0, vy: 0, shield: 60, shieldMax: 60,
                     armor: 50, armorMax: 50, weapons: { pulse: 1 }, cur: "pulse", vseq: 0,
                     superN: 2, fireCd: 0, inv: 0, alive: true, regenT: 0 });
  bullets = []; ebullets = []; enemies = []; booms = []; orbs = []; texts = [];
  boss = null; SP = null; tmapInit(); nextWave();
}
function damagePlayer(d){
  if (!P.alive || P.inv > 0) return;
  P.regenT = 0;
  if (P.shield > 0){
    P.shield -= d;
    if (P.shield < 0){ P.armor += P.shield; P.shield = 0; }
  } else P.armor -= d;
  P.inv = 0.9; SFX.hit(); G.shake = Math.min(6, G.shake + 2.5);
  if (P.armor <= 0){
    P.armor = 0; P.alive = false;
    addBoom(P.x, P.y, 1.6, true);
    addBoom(P.x - 10, P.y + 6, 1.2); addBoom(P.x + 10, P.y - 6, 1.2);
    setTimeout(() => { G.best = Math.max(G.best, G.score); G.state = "over"; }, 1400);
  }
}
function killEnemy(e){
  if (e.dead) return;
  e.dead = true; G.kills++;
  G.score += e.score; G.credits += e.score;
  addBoom(e.x, e.y, 1.1);
  addText(e.x, e.y, "+" + e.score);
  if (Math.random() < 0.16 || (e.type === "e2" && Math.random() < 0.45)) dropOrb(e.x, e.y);
}
function bulletHit(b, j){
  if (b.pierce > 0){ b.pierce--; return false; }
  bullets.splice(j, 1); return true;
}

/* ---------- update ---------- */
function update(dt){
  G.t += dt;
  tmapUpdate(dt);
  if (G.bannerT > 0) G.bannerT -= dt;
  if (SP) updateSuper(dt);

  if (P.alive){
    const ACC = 1500, MAX = 210, FR = 0.86;
    let ax = 0, ay = 0;
    if (keys["arrowleft"] || keys["a"]) ax -= 1;
    if (keys["arrowright"] || keys["d"]) ax += 1;
    if (keys["arrowup"] || keys["w"]) ay -= 1;
    if (keys["arrowdown"] || keys["s"]) ay += 1;
    if (touch.on){
      P.vx += clamp((touch.tx - P.x) * 14, -2600, 2600) * dt;
      P.vy += clamp((touch.ty - P.y) * 14, -2600, 2600) * dt;
      P.vx *= 0.82; P.vy *= 0.82;
    } else {
      P.vx = clamp(P.vx + ax * ACC * dt, -MAX, MAX);
      P.vy = clamp(P.vy + ay * ACC * dt, -MAX, MAX);
      if (!ax) P.vx *= FR;
      if (!ay) P.vy *= FR;
    }
    P.x = clamp(P.x + P.vx * dt, 12, LW - 12);
    P.y = clamp(P.y + P.vy * dt, 30, LH - 18);
    P.fireCd -= dt;
    const wantFire = touch.on || keys[" "] || keys["z"];
    if (wantFire && P.fireCd <= 0){
      playerFire();
      P.fireCd = WPN[P.cur].cd(wlv());
    }
    if (P.inv > 0 && !SP) P.inv -= dt;
    P.regenT += dt;
    if (P.regenT > 2.5 && P.shield < P.shieldMax) P.shield = Math.min(P.shieldMax, P.shield + 7 * dt);
  }

  waveT += dt;
  for (let i = spawnQ.length - 1; i >= 0; i--){
    if (spawnQ[i].t <= waveT){ spawnQ[i].fn(); spawnQ.splice(i, 1); }
  }
  if (!boss && spawnQ.length === 0 && enemies.length === 0 && G.state === "play" && P.alive){
    if (waveClearT < 0) waveClearT = waveT + 1.6;
    if (waveT > waveClearT) nextWave();
  }

  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.t += dt;
    if (b.kind === "light"){ b.y += b.vy * dt; b.x = b.x0 + Math.sin(b.t * 22 + b.ph) * 7; }
    else { b.x += b.vx * dt; b.y += b.vy * dt; }
    if (b.y < -24 || b.y > LH + 24 || b.x < -24 || b.x > LW + 24){ bullets.splice(i, 1); }
  }
  for (let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > LH + 20 || b.y < -20 || b.x < -20 || b.x > LW + 20){ ebullets.splice(i, 1); continue; }
    if (P.alive && aabb(b.x, b.y, b.w, b.h, P.x, P.y, P.w, P.h)){
      ebullets.splice(i, 1); damagePlayer(b.big ? 14 : 8);
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i]; e.t += dt;
    if (e.hcd > 0) e.hcd -= dt;
    if (e.type === "e1"){
      e.y += e.spd * dt;
      e.x = e.bx + Math.sin(e.t * e.f) * e.amp;
      if (G.wave >= 3 && Math.random() < 0.15 * dt) eFire(e.x, e.y + 8, P.x, P.y, 120);
    } else if (e.type === "e2"){
      if (e.y < e.holdY) e.y += e.spd * dt;
      else { e.x += e.drift * dt; e.life -= dt; e.cool -= dt;
        if (e.x < 30 || e.x > LW - 30) e.drift *= -1;
        if (e.cool <= 0 && P.alive){ eFire(e.x, e.y + 10, P.x, P.y, 130 + G.wave * 6); e.cool = rnd(1.1, 2.0) - Math.min(0.6, G.wave * 0.05); }
        if (e.life <= 0) e.y += 60 * dt;
      }
    } else if (e.type === "e3"){
      e.vx += clamp(P.x - e.x, -300, 300) * 1.2 * dt;
      e.x += e.vx * dt; e.y += e.spd * dt;
    }
    for (let j = bullets.length - 1; j >= 0; j--){
      const b = bullets[j];
      if (aabb(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)){
        e.hp -= b.dmg;
        bulletHit(b, j);
        if (e.hp <= 0){ killEnemy(e); break; }
      }
    }
    if (e.dead){ enemies.splice(i, 1); continue; }
    if (P.alive && aabb(e.x, e.y, e.w - 4, e.h - 4, P.x, P.y, P.w, P.h)){
      killEnemy(e); enemies.splice(i, 1); damagePlayer(13); continue;
    }
    if (e.y > LH + 30 || e.x < -40 || e.x > LW + 40) enemies.splice(i, 1);
  }

  if (boss){
    const B = boss; B.t += dt;
    if (B.hcd > 0) B.hcd -= dt;
    if (B.y < 78) B.y += 46 * dt;
    else {
      B.x += B.dir * (34 + G.wave * 2) * dt;
      if (B.x < 60){ B.x = 60; B.dir = 1; }
      if (B.x > LW - 60){ B.x = LW - 60; B.dir = -1; }
      B.cool -= dt;
      if (B.cool <= 0 && P.alive){
        B.phase = (B.phase + 1) % 3;
        if (B.phase !== 1){
          for (let k = -3; k <= 3; k++){
            const ang = Math.PI / 2 + k * 0.24;
            ebullets.push({ x: B.x, y: B.y + 20, vx: Math.cos(ang) * 110, vy: Math.sin(ang) * 110, w: 6, h: 6, big: false });
          }
          SFX.eshoot();
        } else {
          eFire(B.x - 14, B.y + 18, P.x, P.y, 165, true);
          eFire(B.x + 14, B.y + 18, P.x, P.y, 165, true);
        }
        B.cool = Math.max(0.7, 1.5 - G.wave * 0.05);
      }
    }
    for (let j = bullets.length - 1; j >= 0; j--){
      const b = bullets[j];
      if (boss && aabb(b.x, b.y, b.w, b.h, B.x, B.y, B.w, B.h)){
        bulletHit(b, j);
        damageBoss(b.dmg);
      }
    }
    if (boss && P.alive && aabb(B.x, B.y, B.w - 6, B.h - 6, P.x, P.y, P.w, P.h)) damagePlayer(20);
  }

  for (let i = orbs.length - 1; i >= 0; i--){
    const o = orbs[i]; o.t += dt; o.y += o.vy * dt;
    const dx = P.x - o.x, dy = P.y - o.y, L = Math.hypot(dx, dy);
    if (P.alive && L < 70){ o.x += dx / L * 180 * dt; o.y += dy / L * 180 * dt; }
    if (P.alive && aabb(o.x, o.y, 14, 14, P.x, P.y, P.w + 6, P.h + 6)){
      orbs.splice(i, 1); SFX.pow();
      if (o.type === "P"){
        if (wlv() < 6){ P.weapons[P.cur]++; addText(P.x, P.y - 16, "POWER UP!", "#8aff8a"); }
        else { G.score += 500; G.credits += 500; addText(P.x, P.y - 16, "+500", "#8aff8a"); }
      } else {
        P.shield = P.shieldMax; P.armor = Math.min(P.armorMax, P.armor + 18);
        addText(P.x, P.y - 16, "SHIELD!", "#7ecbff");
      }
      continue;
    }
    if (o.y > LH + 16) orbs.splice(i, 1);
  }

  for (let i = booms.length - 1; i >= 0; i--){
    booms[i].t += dt * 2.4;
    if (booms[i].t >= 1) booms.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--){
    texts[i].t += dt; texts[i].y -= 24 * dt;
    if (texts[i].t > 0.9) texts.splice(i, 1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 14 * dt);
}

/* ---------- draw ---------- */
function drawBullet(b){
  if (b.kind === "pulse"){
    const g = ctx.createLinearGradient(b.x, b.y - 8, b.x, b.y + 6);
    g.addColorStop(0, "rgba(140,240,255,0)");
    g.addColorStop(0.5, "#bff6ff");
    g.addColorStop(1, "#4db8ff");
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 1.5, b.y - 8, 3, 14);
  } else if (b.kind === "vulcan"){
    ctx.fillStyle = "#ffe28a";
    ctx.fillRect(b.x - 1, b.y - 5, 2, 8);
    ctx.fillStyle = "#fff8d8";
    ctx.fillRect(b.x - 1, b.y - 5, 2, 3);
  } else if (b.kind === "proton"){
    const g = ctx.createRadialGradient(b.x - 1, b.y - 1, 0.5, b.x, b.y, 4.5);
    g.addColorStop(0, "#eaffea"); g.addColorStop(0.5, "#59e659"); g.addColorStop(1, "#0a7f2a");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, 4.2, 0, 7); ctx.fill();
  } else if (b.kind === "light"){
    ctx.strokeStyle = "#aef4ff"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x + Math.sin(b.t * 22 + b.ph + 1.6) * 3, b.y + 8);
    ctx.lineTo(b.x - 2, b.y + 2);
    ctx.lineTo(b.x + 2, b.y - 3);
    ctx.lineTo(b.x + Math.sin(b.t * 22 + b.ph - 1.6) * 3, b.y - 9);
    ctx.stroke();
    ctx.fillStyle = "#e8ffff";
    ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
  } else if (b.kind === "laser"){
    const g = ctx.createLinearGradient(b.x, b.y - 12, b.x, b.y + 10);
    g.addColorStop(0, "rgba(255,120,120,0)");
    g.addColorStop(0.5, "#ffffff");
    g.addColorStop(1, "rgba(255,60,60,0.6)");
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 1.5, b.y - 12, 3, 24);
    ctx.fillStyle = "rgba(255,80,80,0.5)";
    ctx.fillRect(b.x - 2.5, b.y - 12, 5, 24);
  }
}
function drawEBullet(b){
  ctx.fillStyle = b.big ? "#ffb347" : "#ff5a5a";
  ctx.beginPath(); ctx.arc(b.x, b.y, b.big ? 3.6 : 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
}
function drawBoom(bm){
  const p = clamp(bm.t, 0, 1);
  const r = (4 + 34 * p) * bm.scale;
  const g = ctx.createRadialGradient(bm.x, bm.y, 0, bm.x, bm.y, r);
  g.addColorStop(0, "rgba(255,255,220," + 0.95 * (1 - p) + ")");
  g.addColorStop(0.35, "rgba(255,170,50," + 0.8 * (1 - p) + ")");
  g.addColorStop(0.75, "rgba(255,60,10," + 0.5 * (1 - p) + ")");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bm.x, bm.y, r, 0, 7); ctx.fill();
  for (let k = 0; k < 7; k++){
    const a = bm.seed + k * 0.897;
    const d = r * (0.55 + ((k * 37) % 10) / 22);
    ctx.fillStyle = "rgba(255," + (150 + (k * 53) % 90) + ",60," + (1 - p) + ")";
    ctx.fillRect(bm.x + Math.cos(a) * d - 1.5, bm.y + Math.sin(a) * d - 1.5, 3, 3);
  }
}
function drawOrb(o){
  const yy = o.y + Math.sin(o.t * 5) * 2;
  const r = 6 * (1 + Math.sin(o.t * 6) * 0.14);
  const cols = o.type === "P" ? ["#f0fff0", "#59e659", "#0a7f2a"] : ["#eef8ff", "#54b4ff", "#0a4f9f"];
  ctx.globalCompositeOperation = "lighter";
  let g = ctx.createRadialGradient(o.x, yy, 0, o.x, yy, r * 2.2);
  g.addColorStop(0, "rgba(200,255,220,0.45)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, yy, r * 2.2, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  g = ctx.createRadialGradient(o.x - 2, yy - 2, 1, o.x, yy, r);
  g.addColorStop(0, cols[0]); g.addColorStop(0.55, cols[1]); g.addColorStop(1, cols[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, yy, r, 0, 7); ctx.fill();
  ctx.fillStyle = o.type === "P" ? "#043012" : "#062248";
  ctx.font = "bold 8px 'Courier New', monospace"; ctx.textAlign = "center";
  ctx.fillText(o.type, o.x, yy + 3);
}
function drawPhantom(q){
  ctx.globalAlpha = q.a;
  const w = CW * q.s, h = CH * q.s;
  const g = ctx.createLinearGradient(q.x, q.y, q.x, q.y + 26);
  g.addColorStop(0, "rgba(140,220,255,0.5)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(q.x - 2, q.y + 8, 4, 26);
  ctx.drawImage(ghost, 0, 0, CW, CH, Math.round(q.x - w/2), Math.round(q.y - h/2), w, h);
  ctx.globalAlpha = 1;
}
function bar(x, y, w, h, frac, c1, c2){
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(x, y, Math.max(0, w * clamp(frac, 0, 1)), h);
}
function text(s, x, y, size, col, align){
  ctx.font = "bold " + size + "px 'Courier New', monospace";
  ctx.textAlign = align || "left";
  ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

  }

  }
  ctx.globalAlpha = P.superN > 0 ? 0.92 : 0.35;
  const g = ctx.createRadialGradient(SBTN.x - 4, SBTN.y - 5, 2, SBTN.x, SBTN.y, SBTN.r);
  g.addColorStop(0, "#4a2f8f"); g.addColorStop(1, "#17102f");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(SBTN.x, SBTN.y, SBTN.r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#8f7aff"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(SBTN.x, SBTN.y, SBTN.r, 0, 7); ctx.stroke();
  text("S", SBTN.x, SBTN.y + 3, 13, "#cfc2ff", "center");
  text("x" + P.superN, SBTN.x, SBTN.y + 14, 7, "#cfc2ff", "center");
  ctx.globalAlpha = 1;
}
function drawPlayer(){
  if (!P.alive) return;
  if (P.inv > 0 && !SP && ((G.t * 20) | 0) % 2) return;
  ctx.globalCompositeOperation = "lighter";
  const fl = 5 + Math.sin(G.t * 40) * 2.5;
  const g = ctx.createLinearGradient(P.x, P.y + 10, P.x, P.y + 12 + fl + 4);
  g.addColorStop(0, "rgba(140,200,255,0.9)");
  g.addColorStop(1, "rgba(40,80,255,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(P.x - 3, P.y + 10); ctx.lineTo(P.x + 3, P.y + 10); ctx.lineTo(P.x, P.y + 12 + fl);
  ctx.closePath(); ctx.fill();
  if (SP){
    const rg = ctx.createRadialGradient(P.x, P.y, 2, P.x, P.y, 26);
    rg.addColorStop(0, "rgba(160,220,255,0.5)"); rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(P.x, P.y, 26, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  const ang = clamp(P.vx * 0.0007, -0.15, 0.15);
  ctx.save();
  ctx.translate(Math.round(P.x), Math.round(P.y));
  ctx.rotate(ang);
  ctx.drawImage(atlas, 0, 0, CW, CH, -12, -14, CW, CH);
  ctx.restore();
}
function draw(){
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  tmapDraw();

  if (SP) for (const h of SP.holes) drawHole(h);
  for (const o of orbs) drawOrb(o);
  for (const e of enemies) spr(e.type, 0, e.x, e.y, 1);
  if (boss) spr("e2", 0, boss.x, boss.y, 2.4);
  for (const b of bullets) drawBullet(b);
  if (SP){
    ctx.globalCompositeOperation = "lighter";
    for (const q of SP.ph) drawPhantom(q);
    ctx.globalCompositeOperation = "source-over";
  }
  drawPlayer();
  for (const b of ebullets) drawEBullet(b);

  ctx.globalCompositeOperation = "lighter";
  for (const bm of booms) drawBoom(bm);
  ctx.globalCompositeOperation = "source-over";

  for (const t of texts){
    ctx.globalAlpha = 1 - t.t / 0.9;
    text(t.s, t.x, t.y, 9, t.col, "center");
    ctx.globalAlpha = 1;
  }

  if (SP){
    if (SP.t < 1.0) drawBubble("hey! I am Jungjioo!!", P.x, P.y - 46);
    else if (SP.t < 2.1) drawBubble("Spid!!", P.x, P.y - 46);
  }
  ctx.restore();

  drawHUD();
  if (G.bannerT > 0){
    ctx.globalAlpha = Math.min(1, G.bannerT * 2);
    text(G.banner, LW / 2, 150, 20, G.banner.includes("WARN") ? "#ff6a6a" : "#e8ecff", "center");
    ctx.globalAlpha = 1;
  }
  if (G.state === "pause"){
    ctx.fillStyle = "rgba(0,0,10,0.6)"; ctx.fillRect(0, 0, LW, LH);
    text("PAUSED", LW / 2, LH / 2, 22, "#e8ecff", "center");
    text("P 키로 계속", LW / 2, LH / 2 + 22, 10, "#9aa6c8", "center");
  }
}

function drawTitle(){
  tmapUpdate(1 / 60); tmapDraw();
  ctx.fillStyle = "rgba(2,4,16,0.45)"; ctx.fillRect(0, 0, LW, LH);
  const bob = Math.sin(G.t * 2) * 4;
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(LW/2, 196 + bob, 4, LW/2, 196 + bob, 60);
  g.addColorStop(0, "rgba(90,140,255,0.35)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(LW/2 - 60, 136 + bob, 120, 120);
  ctx.globalCompositeOperation = "source-over";
  spr("player", 0, LW / 2, 196 + bob, 3);
  drawOrb({ x: LW / 2 + Math.cos(G.t * 1.6) * 70, y: 196 + bob + Math.sin(G.t * 1.6) * 26, t: G.t, type: "P" });

  text("별의 일생", LW / 2, 108, 38, "#dfe8ff", "center");
  text("— a Tyrian-style demo —", LW / 2, 144, 9, "#8a93b0", "center");

  if (((G.t * 1.4) | 0) % 2) text(G.best ? "다시 출격: 탭 / ENTER" : "탭 또는 ENTER로 출격", LW / 2, 286, 12, "#fff2b0", "center");
  text("이동: 방향키·WASD·드래그 / 발사: SPACE·Z (터치 자동)", LW / 2, 314, 8, "#9aa6c8", "center");
  text("슈퍼무기: X·B 또는 S버튼 / 상점: 보스 격파 후", LW / 2, 328, 8, "#9aa6c8", "center");
  text("P 일시정지 · M 음소거", LW / 2, 342, 8, "#9aa6c8", "center");
  if (G.best) text("BEST " + G.best, LW / 2, 368, 11, "#ffd76a", "center");

  text("Graphics: \"Remastered Tyrian Graphics\"", LW / 2, 438, 8, "#5a6a92", "center");
  text("by Daniel Cook (lostgarden.com) · CC-BY 3.0", LW / 2, 450, 8, "#5a6a92", "center");
  text("원작 게임과 무관한 팬 데모입니다", LW / 2, 462, 8, "#44507a", "center");
}
function drawOver(){
  draw();
  ctx.fillStyle = "rgba(6,2,10,0.62)"; ctx.fillRect(0, 0, LW, LH);
  text("GAME OVER", LW / 2, 190, 26, "#ff8a8a", "center");
  text("SCORE  " + G.score, LW / 2, 226, 14, "#fff2b0", "center");
  text("WAVE   " + G.wave, LW / 2, 246, 11, "#cfd8ff", "center");
  if (G.score >= G.best && G.score > 0) text("NEW RECORD!", LW / 2, 268, 11, "#8aff8a", "center");
  if (((G.t * 1.4) | 0) % 2) text("탭 / ENTER — 재도전", LW / 2, 320, 11, "#e8ecff", "center");
}

/* ---------- main loop ---------- */
let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  if (G.state !== "play") G.t += dt;
  ctx.clearRect(0, 0, LW, LH);
  if (!ready){
    text("LOADING...", LW / 2, LH / 2, 14, "#9aa6c8", "center");
    return;
  }
  if (G.state === "play"){ update(dt); draw(); }
  else if (G.state === "pause"){ draw(); }
  else if (G.state === "shop"){ drawShop(); }
  else if (G.state === "title"){ drawTitle(); }
  else if (G.state === "over"){ drawOver(); }
}
requestAnimationFrame(frame);

/* ---------- scaling ---------- */
function fit(){
  const s = Math.min(innerWidth / LW, innerHeight / LH) * 0.985;
  cv.style.width = (LW * s) + "px";
  cv.style.height = (LH * s) + "px";
}
addEventListener("resize", fit); fit();
tmapInit();
</script>
